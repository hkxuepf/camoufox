name: Build CamouChromium C++ Kernel

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Chromium Kernel Version Tag (e.g. v155.0.8059.39)"
        required: true
        default: "v155.0.8059.39"
      upload_release:
        description: "Upload artifacts to GitHub Releases"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build CamouChromium (macOS Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout CamouHub repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Google depot_tools
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: cloning depot_tools..."
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools" && break || \
            git clone --depth 1 https://github.com/chromium/tools-depot_tools.git "$HOME/depot_tools" && break || \
            sleep 5
          done
          echo "$HOME/depot_tools" >> $GITHUB_PATH
          bash "$HOME/depot_tools/ensure_bootstrap" || true

      - name: Ensure GN and Ninja Build Tools
        run: |
          brew install gn ninja || true

      - name: Cache Chromium Source Tree (Shallow)
        id: cache-chromium
        uses: actions/cache@v4
        with:
          path: src
          key: chromium-src-${{ inputs.version_tag }}-macos-arm64

      - name: Fetch Chromium Source
        if: steps.cache-chromium.outputs.cache-hit != 'true'
        run: |
          mkdir -p chromium_build && cd chromium_build
          echo 'solutions = [{"name": "src", "url": "https://chromium.googlesource.com/chromium/src.git", "deps_file": ".DEPS.git", "managed": False, "custom_deps": {}}]' > .gclient
          echo 'target_os = ["mac"]' >> .gclient
          TARGET_BRANCH=$(echo "${{ inputs.version_tag }}" | sed 's/^v//')
          echo "Fetching Chromium source branch: $TARGET_BRANCH"
          for i in 1 2 3; do
            echo "Attempt $i: cloning Chromium src ($TARGET_BRANCH)..."
            git clone --depth 1 --branch "$TARGET_BRANCH" https://chromium.googlesource.com/chromium/src.git src && break || \
            sleep 10
          done
          cd src
          gclient sync --no-history --shallow -j8
          gclient runhooks

      - name: Apply Camou Stealth C++ Patches
        run: |
          cd chromium_build/src || cd src
          echo "Applying CamouChromium C++ stealth patches..."
          if [ -d "$GITHUB_WORKSPACE/patches/chromium" ]; then
            for patch in $GITHUB_WORKSPACE/patches/chromium/*.patch; do
              if [ -f "$patch" ]; then
                echo "Applying $patch"
                git apply "$patch" || git apply --reject "$patch" || true
              fi
            done
          fi

      - name: Configure GN Args for Fast & Release Build
        run: |
          cd chromium_build/src || cd src
          GN_BIN=$(which gn || echo "/opt/homebrew/bin/gn")
          "$GN_BIN" gen out/Release --args='
            is_debug=false
            is_component_build=false
            symbol_level=0
            blink_symbol_level=0
            target_cpu="arm64"
            is_official_build=false
            enable_nacl=false
            chrome_pgo_phase=0
            use_system_xcode=true
            use_clang_modules=false
            use_unified_system_module=false
          '

      - name: Compile Chromium with Ninja
        run: |
          cd chromium_build/src || cd src
          ninja -C out/Release chrome -j$(sysctl -n hw.ncpu)

      - name: Package CamouChromium.app
        run: |
          cd chromium_build/src/out/Release || cd src/out/Release
          tar -czvf $GITHUB_WORKSPACE/CamouChromium-mac-arm64.tar.gz Chromium.app

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CamouChromium-mac-arm64
          path: CamouChromium-mac-arm64.tar.gz

      - name: Publish to GitHub Release
        if: ${{ inputs.upload_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.version_tag }}" CamouChromium-mac-arm64.tar.gz --clobber || \
          gh release create "${{ inputs.version_tag }}" CamouChromium-mac-arm64.tar.gz --title "CamouChromium C++ Kernel ${{ inputs.version_tag }}" --notes "Automated build of CamouChromium C++ Stealth Kernel."
