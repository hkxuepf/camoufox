# Run it with:  docker compose up
# then open http://localhost:8000
#
# One service: the API and the web UI are served from one process on one port,
# so there is no second container and no CORS to configure.
#
# The port is published to loopback (127.0.0.1) only, because the app is open by
# default. Before exposing it beyond this host, create a user account
# (`docker compose exec app uv run camoufox-pm user add <name>`) or set
# CPM_API_KEY, and set CPM_SECRET_KEY to encrypt proxy passwords at rest.
services:
  app:
    build: .
    container_name: camoufox-app
    restart: unless-stopped
    environment:
      CPM_SECRET_KEY: "LdNkRX1Ne11-gJvBM2GaeyOIXQVpUbALsAUA78EQWo8="
      CPM_SECURE_COOKIES: "1"
      CPM_HOST: "0.0.0.0"
      CPM_PORT: "8000"
      CPM_CLOUD_SERVER: ""
      CPM_DB_PATH: "/data/profiles.db"
    volumes:
      - cpm-data:/data
    networks:
      - camoufox-net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: camoufox-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token eyJhIjoiYTQxNmE1OGY2YjFkNjlhODdkNTJiZjBjNzBjMjcxNjMiLCJ0IjoiOWI0MzFmOGUtYjA3NC00MjE5LTgzZjQtMzVkMGNjZjRiNDE4IiwicyI6Ik9XWm1Zek16TmpNdE1USmtOaTAwWWpJekxUa3haREF0T1ROaVlXSTNZVFUzWWpjeSJ9
    depends_on:
      - app
    networks:
      - camoufox-net

volumes:
  cpm-data:

networks:
  camoufox-net:

